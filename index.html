<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FormSathi - form-filling helper</title>
    <meta
      name="description"
      content="Take a photo of a form, answer in English, and it fills itself. Works offline, and your personal data never leaves your phone."
    />
    <meta name="theme-color" content="#0f5132" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FormSathi" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; font-family: system-ui">
        <h1>JavaScript required</h1>
        <p>Enable JavaScript in your browser to run FormSathi.</p>
      </div>
    </noscript>

    <div id="app" class="app">
      <!-- Boot skeleton: painted instantly, replaced by the router on first tick. -->
      <div class="screen">
        <div class="row gap-8">
          <span class="brand-mark">F</span>
          <b>FormSathi</b>
        </div>
        <p class="muted mt-16">Starting…</p>
        <div class="progress mt-8"><i style="width: 30%"></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
